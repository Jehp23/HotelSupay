<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4E4C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A961;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Montañas estilizadas -->
  <g transform="translate(5, 20)">
    <path d="M 20 25 L 30 8 L 40 25 Z" fill="url(#mountainGrad)" opacity="0.9"/>
    <path d="M 10 25 L 20 12 L 30 25 Z" fill="url(#goldGradient)" opacity="0.7"/>
    <path d="M 30 25 L 40 12 L 50 25 Z" fill="url(#goldGradient)" opacity="0.6"/>
    <circle cx="45" cy="10" r="3" fill="#F4E4C1" opacity="0.8"/>
  </g>
  
  <!-- Texto HOTEL -->
  <text x="65" y="28" font-family="serif" font-size="12" font-weight="400" letter-spacing="2" fill="#5C4A3A">
    HOTEL
  </text>
  
  <!-- Texto SUPAY -->
  <text x="65" y="45" font-family="serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="url(#goldGradient)">
    SUPAY
  </text>
  
  <!-- Línea decorativa -->
  <line x1="65" y1="32" x2="135" y2="32" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.5"/>
</svg>
